<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>感測器整合系統</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%234c8dff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='monitor.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>感測器整合系統</h1>
    </div>
    <div class="topbar-meta">
      <span class="chip chip-sim" id="sim-chip" hidden title="這些感測器的數值是模擬產生的，不是真實量測">模擬模式</span>
      <span class="chip" id="conn-chip" title="與伺服器的即時連線"><span class="dot" data-level="idle"></span><span id="conn-text">連線中</span></span>
    </div>
  </header>

  <div class="layout">
    <!-- 左側：設定與控制 -->
    <aside class="sidebar" aria-label="設定">
      <form id="settings" autocomplete="off" novalidate>
        <section class="group">
          <h2>裝置</h2>
          <label class="field">
            <span class="field-label">溫度感測器 COM 端口</span>
            <div class="field-row">
              <input id="com_port" name="com_port" list="com-list" placeholder="例：COM3 或 /dev/cu.usbserial" spellcheck="false">
              <button type="button" class="btn-icon" id="refresh-com" title="重新整理 COM" aria-label="重新整理 COM">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <datalist id="com-list"></datalist>
            <span class="field-hint" id="com-hint">可從清單選擇或直接輸入</span>
          </label>
          <label class="field">
            <span class="field-label">音訊設備</span>
            <div class="field-row">
              <select id="audio_device" name="audio_device"></select>
              <button type="button" class="btn-icon" id="refresh-audio" title="重新整理音訊" aria-label="重新整理音訊">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </label>
        </section>

        <section class="group">
          <h2>音訊參數</h2>
          <div class="grid-2">
            <label class="field">
              <span class="field-label">採樣率</span>
              <div class="input-unit"><input id="sample_rate" name="sample_rate" inputmode="numeric" value="22050"><span>Hz</span></div>
            </label>
            <label class="field">
              <span class="field-label">更新間隔</span>
              <div class="input-unit"><input id="update_interval" name="update_interval" inputmode="decimal" value="0.1"><span>秒</span></div>
            </label>
            <label class="field span-2">
              <span class="field-label">頻譜圖顯示長度</span>
              <div class="input-unit"><input id="history_duration" name="history_duration" inputmode="decimal" value="100"><span>秒</span></div>
              <span class="field-hint">只影響畫面，不影響存檔；存檔一律保存全程</span>
            </label>
          </div>
        </section>

        <section class="group">
          <h2>測距儀</h2>
          <div class="field">
            <div class="field-label-row">
              <label class="field-label" for="refl_mode">反射模式</label>
              <button type="button" class="help-btn" aria-label="反射模式說明" aria-describedby="refl-tip">
                <!-- 自繪 questionmark.circle（不依賴 SF Symbols 字型） -->
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6.1 6.2a1.95 1.95 0 1 1 2.9 1.7c-.7.4-1 .8-1 1.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="11.5" r=".85" fill="currentColor"/></svg>
              </button>
              <div class="help-tip" id="refl-tip" role="tooltip">
                <p><b>0-漫反射</b>：霧面、粗糙表面，如塗層、陶瓷、未拋光金屬、紙、樹脂；感測頭垂直對準待測面。</p>
                <p><b>1-鏡面反射</b>：鏡面、玻璃、拋光金屬；感測頭需傾斜安裝，讓反射光回到受光部（角度依 KEYENCE 說明書）。</p>
                <p>讀值不穩或讀不到時，先確認模式是否符合表面。</p>
              </div>
            </div>
            <select id="refl_mode" name="refl_mode">
              <option value="0">0-漫反射</option>
              <option value="1">1-鏡面反射</option>
            </select>
          </div>
          <label class="field">
            <span class="field-label">測距間隔</span>
            <div class="input-unit"><input id="distance_interval" name="distance_interval" inputmode="decimal" value="0.1"><span>秒</span></div>
            <span class="field-hint">程式讀取測距儀的頻率，0.1 秒＝每秒 10 筆，決定存檔資料密度</span>
          </label>
        </section>
      </form>

      <div class="controls">
        <button type="button" class="btn btn-start" id="btn-start">開始監測</button>
        <button type="button" class="btn btn-stop" id="btn-stop" disabled>停止監測</button>
      </div>

      <!-- 感測器狀態：每個感測器一列（key 對應 /api/state 的 sensors；光譜儀尚未整合，先預留「未接入」） -->
      <section class="group sensor-panel" id="sensor-panel" aria-label="感測器狀態">
        <h2>感測器狀態</h2>
        <div class="sensor-row" data-sensor="temp">
          <div class="sr-head"><span class="dot" data-level="idle"></span><span class="sr-name">溫度</span><span class="sim-tag" data-sim="temp" hidden>模擬</span><span class="sr-badge" data-tone="neutral">待機</span></div>
          <div class="sr-meta" hidden><span class="sr-last" hidden></span><span class="sr-fails" hidden></span></div>
          <div class="sr-detail" hidden></div>
        </div>
        <div class="sensor-row" data-sensor="audio">
          <div class="sr-head"><span class="dot" data-level="idle"></span><span class="sr-name">音訊</span><span class="sim-tag" data-sim="audio" hidden>模擬</span><span class="sr-badge" data-tone="neutral">待機</span></div>
          <div class="sr-meta" hidden><span class="sr-last" hidden></span><span class="sr-fails" hidden></span></div>
          <div class="sr-detail" hidden></div>
        </div>
        <div class="sensor-row" data-sensor="distance">
          <div class="sr-head"><span class="dot" data-level="idle"></span><span class="sr-name">距離</span><span class="sim-tag" data-sim="distance" hidden>模擬</span><span class="sr-badge" data-tone="neutral">待機</span></div>
          <div class="sr-meta" hidden><span class="sr-last" hidden></span><span class="sr-fails" hidden></span></div>
          <div class="sr-detail" hidden></div>
        </div>
        <div class="sensor-row" data-sensor="spectrometer">
          <div class="sr-head"><span class="dot" data-level="idle"></span><span class="sr-name">光譜儀</span><span class="sr-badge" data-tone="neutral">未接入</span></div>
          <div class="sr-meta" hidden><span class="sr-last" hidden></span><span class="sr-fails" hidden></span></div>
          <div class="sr-detail" hidden></div>
        </div>
      </section>
    </aside>

    <!-- 右側：數值與圖表 -->
    <main class="content">
      <section class="stats" aria-label="狀態顯示">
        <article class="stat" id="card-time">
          <header><span class="dot" data-level="idle"></span><h3>執行時間</h3></header>
          <div class="stat-value"><span class="num" id="time-num">0</span><span class="unit">秒</span></div>
          <div class="progress" aria-hidden="true"><div class="progress-bar" id="time-bar"></div></div>
          <p class="stat-sub" id="time-sub">設定 60 秒</p>
        </article>
        <article class="stat stat-status" id="card-status">
          <header><span class="dot" data-level="idle"></span><h3>狀態</h3></header>
          <div class="status-text" id="status-text">待機中</div>
          <ul class="lamps">
            <li id="lamp-temp"><span class="dot" data-level="idle"></span>溫度</li>
            <li id="lamp-audio"><span class="dot" data-level="idle"></span>音訊</li>
            <li id="lamp-distance"><span class="dot" data-level="idle"></span>距離</li>
          </ul>
          <p class="stat-sub" id="audio-sub">音訊：--</p>
        </article>
      </section>

      <section class="recbar" id="recbar" aria-label="存檔狀態" hidden>
        <div class="recbar-head">
          <span class="dot" data-level="idle" id="rec-dot"></span>
          <span class="recbar-title" id="rec-title">資料存檔中</span>
          <code class="recbar-dir" id="rec-dir"></code>
        </div>
        <ul class="recbar-files" id="rec-files"></ul>
      </section>

      <section class="charts" aria-label="圖表">
        <figure class="chart chart-spec">
          <figcaption><h3>Spectrogram <span class="sim-tag" data-sim="audio" hidden>模擬音訊</span></h3><span class="chart-note" id="spec-note">NFFT 256 · overlap 128</span></figcaption>
          <div class="canvas-wrap canvas-spec"><canvas id="cv-spec"></canvas></div>
        </figure>
        <figure class="chart">
          <figcaption><h3>Temperature <span class="sim-tag" data-sim="temp" hidden>模擬</span></h3><span class="chart-note" id="temp-note">--</span></figcaption>
          <div class="canvas-wrap"><canvas id="cv-temp"></canvas></div>
        </figure>
        <figure class="chart">
          <figcaption><h3>Distance <span class="sim-tag" data-sim="distance" hidden>模擬</span></h3><span class="chart-note" id="dist-note">--</span></figcaption>
          <div class="canvas-wrap"><canvas id="cv-dist"></canvas></div>
        </figure>
      </section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog id="dlg">
    <form method="dialog" class="dlg-body">
      <h2 id="dlg-title">警告</h2>
      <p id="dlg-lead"></p>
      <ul id="dlg-list"></ul>
      <p id="dlg-question"></p>
      <div class="dlg-actions">
        <button value="cancel" class="btn btn-ghost" id="dlg-cancel">取消</button>
        <button value="ok" class="btn btn-start" id="dlg-ok">繼續監測</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='monitor.js') }}"></script>
</body>
</html>
